<object id="embeddedComponent" 
	data="{{wf:Embed Link|Dynamo}}" 
  style="width: 100%; height: 100%; border: none; border-radius: 15px; overflow: hidden" 
  type="text/html">
    Your browser seems not to support our configurator.
</object>

<script>
// Get the current URL of the parent page
const urlParams = new URLSearchParams(window.location.search);
const reloadParam = urlParams.get('reload');
const embedLink = '{{wf:Embed Link|Dynamo}}';

// return true if embedlink contains a uid parameter
const isLegacyConfigurator =  () => { return embedLink.includes('?uid=') || embedLink.includes('?type=');}
console.log('is legacy configurator? ' + isLegacyConfigurator() );
// identify embedded component
const embeddedComponent = document.getElementById('embeddedComponent'); 

//add reload Parameter to embedded component
// use first method if embedlink contains no ?uid value
// use second method of a ?uid value is found
if (reloadParam && embedLink && !isLegacyConfigurator()) {
        const newEmbedLink = embedLink + '&reloadid=' + reloadParam;
        embeddedComponent.data = newEmbedLink;
        console.log('embed link with reload' + newEmbedLink)
    } else if(reloadParam && embedLink && isLegacyConfigurator()){

        const getCleanEmbedLink = () => {
            const cleanEmbedLink = embedLink.split('?')[0];
            return cleanEmbedLink;
        };
        //composee new embed link
        const newEmbedLink = getCleanEmbedLink() + '?uid=' + reloadParam;
        embeddedComponent.data = newEmbedLink;
        console.log('legacy UID parameter' + newEmbedLink)
   };


</script>
